name: test
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Demo data is up to date
        run: node scripts/make-demo-data.mjs && git diff --exit-code site/demo
      - run: npm test
