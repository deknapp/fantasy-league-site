<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Franchise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root {
    --navy: #12203A; --navy-deep: #0E1A2E; --chalk: #EDEDE3; --muted: #7C8B99;
    --green: #3FA34D; --gold: #C9A227; --amber: #E8A33D;
    --line: rgba(255,255,255,.12); --line-soft: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { background: var(--navy); color: var(--chalk); font-family: 'Inter', system-ui, sans-serif; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  code { font-size: 12px; background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 3px; }
  ::selection { background: var(--green); color: var(--navy); }

  .center-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .strong { font-weight: 600; }

  header.app-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 28px 32px 20px; border-bottom: 1px solid var(--line); }
  .header-kicker { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 600; }
  header .muted { font-size: 13px; }
  .demo-tag { color: var(--amber); }

  nav.tabs { display: flex; gap: 4px; padding: 12px 32px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: transparent; border: none; color: var(--muted); padding: 10px 16px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--chalk); border-bottom-color: var(--green); }
  .league-pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 32px 0; }
  .pill, .chip { background: transparent; border: 1px solid rgba(255,255,255,.18); color: var(--chalk); border-radius: 20px; padding: 6px 14px; font-size: 13px; }
  .pill.active { background: var(--green); border-color: var(--green); color: var(--navy); font-weight: 600; }
  .chip.active { background: var(--chalk); color: var(--navy); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 8px; vertical-align: middle; }
  .dot.loading { background: var(--muted); }
  .dot.error { background: var(--amber); }

  main.app-main { padding: 24px 32px 48px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 16px; max-width: 760px; }

  .table-wrap { border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; font-weight: 500; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { color: var(--muted); width: 1%; }
  td.gold { color: var(--gold); font-weight: 700; }
  .place { display: block; font-size: 11px; color: var(--muted); }
  tr.me td { background: rgba(63,163,77,.14); }
  tr.bench td { opacity: .7; }
  .link-btn { background: none; border: none; color: inherit; padding: 0; font: inherit; font-weight: 600; text-align: left; }
  .link-btn:hover { text-decoration: underline; }

  .empty-state { text-align: center; padding: 48px 20px; border: 1px dashed rgba(255,255,255,.15); border-radius: 4px; }
  .empty-title { font-family: 'Oswald', sans-serif; font-size: 18px; margin-bottom: 8px; }
  .message { border-radius: 4px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .message.error { color: var(--amber); border: 1px solid rgba(232,163,61,.4); }
  .message.ok, .message.info { color: #c9d6cd; border: 1px solid rgba(63,163,77,.35); }
  .info-banner { background: rgba(63,163,77,.1); border: 1px solid rgba(63,163,77,.35); border-radius: 4px; padding: 12px 14px; font-size: 13px; color: #c9d6cd; line-height: 1.5; margin-bottom: 24px; }

  .settings { max-width: 680px; }
  .settings-section { margin-bottom: 32px; }
  .section-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .input { background: var(--navy-deep); border: 1px solid rgba(255,255,255,.18); color: var(--chalk); border-radius: 4px; padding: 10px 12px; font-size: 14px; flex: 1; min-width: 0; }
  .input.compact { flex: 0 1 220px; padding: 6px 8px; font-size: 13px; }
  .btn-primary { background: var(--green); border: none; color: var(--navy-deep); border-radius: 4px; padding: 10px 18px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.18); color: var(--chalk); border-radius: 4px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  .league-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .add-league-grid { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; margin-top: 16px; }
  .help-text { color: var(--muted); font-size: 12px; margin: 10px 0; line-height: 1.5; }

  .trade-card { border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
  .trade-header { display: flex; justify-content: space-between; align-items: center; }
  .trade-items { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: 14px; }
  .status-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 2px 10px; }
  .status-tag.live { color: var(--green); border-color: rgba(63,163,77,.5); }

  @media (max-width: 640px) {
    header.app-header, nav.tabs, main.app-main, .league-pills { padding-left: 16px; padding-right: 16px; }
    .add-league-grid { grid-template-columns: 1fr; }
    .league-row { flex-wrap: wrap; }
    th, td { padding: 8px 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript><div class="center-screen">This site needs JavaScript to load the league data.</div></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
